<div class="app-window" id="TasksApp">
  <div class="app-header">
    <span class="app-title">📋 Tasks</span>
    <div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div>
  </div>
  <div class="app-content">
    <div class="todo">
      <form id="todo-form" class="todo-form">
        <input id="todo-input" type="text" placeholder="Add a task…" autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <ul id="todo-list" class="todo-list"></ul>
      <div id="todo-empty" class="todo-empty">No tasks yet. Add one above.</div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
